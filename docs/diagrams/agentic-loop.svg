<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="Archivo, 'Segoe UI', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b33"/></marker></defs><rect width="1600" height="1080" fill="#f6f8fb"/><text x="40" y="52.0" font-size="28" font-weight="800" fill="#0b1b33" text-anchor="start">Skema Sistem: Satu Siklus Agentic dari Event sampai Dampak di Dunia Nyata</text><text x="40" y="80.0" font-size="15" font-weight="400" fill="#5b6b82" text-anchor="start">Tujuh langkah ini sama dengan bilah langkah di halaman Live Operations 3D. Lingkungan yang berubah dibaca lagi oleh sensor, sehingga siklus tertutup.</text><path d="M936,240 Q1001,204 1004,265" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1164,392 Q1251,442 1201,515" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1159,656 Q1162,739 1055,755" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M838,817 Q800,871 762,817" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M545,755 Q438,739 441,656" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M399,515 Q349,442 436,392" fill="none" stroke="#0b1b33" stroke-width="2.5" marker-end="url(#ah)"/><path d="M596,265 Q599,204 664,240" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="650.0" y="134.0" width="300" height="112" rx="6" fill="#fff" stroke="#0b1b33" stroke-width="2.5"/><rect x="650.0" y="134.0" width="36" height="112" rx="6" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="668.0" y="198.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="698.0" y="158.0" font-size="11.5" font-weight="800" fill="#0b1b33" text-anchor="start">EVENT · PERCEIVE</text><text x="698.0" y="180.0" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Sensor IIoT: silo PP C 24%</text><text x="698.0" y="202.0" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">aturan &lt; 25% memicu event</text><text x="698.0" y="219.0" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">badai, pemasok, lonjakan</text><rect x="990.5657937630738" y="258.24836538661793" width="300" height="112" rx="6" fill="#fff" stroke="#0b1b33" stroke-width="2.5"/><rect x="990.5657937630738" y="258.24836538661793" width="36" height="112" rx="6" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="1008.5657937630738" y="322.24836538661793" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="1038.5657937630738" y="282.24836538661793" font-size="11.5" font-weight="800" fill="#0b1b33" text-anchor="start">PLAN · REASON</text><text x="1038.5657937630738" y="304.24836538661793" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Orchestrator Agent</text><text x="1038.5657937630738" y="326.24836538661793" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">menyusun task plan</text><text x="1038.5657937630738" y="343.24836538661793" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">memilih agent yang dipanggil</text><rect x="1074.6785985464023" y="537.4319082055838" width="300" height="112" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/><rect x="1074.6785985464023" y="537.4319082055838" width="36" height="112" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/><text x="1092.6785985464023" y="601.4319082055838" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1122.6785985464023" y="561.4319082055838" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="start">WORK · REASON</text><text x="1122.6785985464023" y="583.4319082055838" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">4 agent bekerja paralel</text><text x="1122.6785985464023" y="605.4319082055838" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">Stock, Forecast, Priority (MFG)</text><text x="1122.6785985464023" y="622.4319082055838" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">Fleet Tracking (SHP)</text><rect x="838.9997567596083" y="761.3197264077983" width="300" height="112" rx="6" fill="#fff" stroke="#0b1b33" stroke-width="2.5"/><rect x="838.9997567596083" y="761.3197264077983" width="36" height="112" rx="6" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="856.9997567596083" y="825.3197264077983" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="886.9997567596083" y="785.3197264077983" font-size="11.5" font-weight="800" fill="#0b1b33" text-anchor="start">DECIDE · REASON</text><text x="886.9997567596083" y="807.3197264077983" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Dispatch Planner Agent</text><text x="886.9997567596083" y="829.3197264077983" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">filter keras, SAW, greedy</text><text x="886.9997567596083" y="846.3197264077983" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">kapal terbaik per plant</text><rect x="461.0002432403917" y="761.3197264077983" width="300" height="112" rx="6" fill="#fff" stroke="#0b1b33" stroke-width="2.5"/><rect x="461.0002432403917" y="761.3197264077983" width="36" height="112" rx="6" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="479.0002432403917" y="825.3197264077983" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="509.0002432403917" y="785.3197264077983" font-size="11.5" font-weight="800" fill="#0b1b33" text-anchor="start">EXPLAIN · REASON</text><text x="509.0002432403917" y="807.3197264077983" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Narrator Agent</text><text x="509.0002432403917" y="829.3197264077983" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">kalimat dari angka terverifikasi</text><text x="509.0002432403917" y="846.3197264077983" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">LLM opsional, dijaga</text><rect x="225.32140145359762" y="537.4319082055838" width="300" height="112" rx="6" fill="#fff" stroke="#b45309" stroke-width="2.5"/><rect x="225.32140145359762" y="537.4319082055838" width="36" height="112" rx="6" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="243.32140145359762" y="601.4319082055838" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="273.3214014535976" y="561.4319082055838" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="start">ACT</text><text x="273.3214014535976" y="583.4319082055838" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Manusia menyetujui (Box 8)</text><text x="273.3214014535976" y="605.4319082055838" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">Approve atau Reject</text><text x="273.3214014535976" y="622.4319082055838" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">jam menunggu tanda tangan</text><rect x="309.4342062369262" y="258.248365386618" width="300" height="112" rx="6" fill="#fff" stroke="#0e7490" stroke-width="2.5"/><rect x="309.4342062369262" y="258.248365386618" width="36" height="112" rx="6" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="327.4342062369262" y="322.248365386618" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="357.4342062369262" y="282.248365386618" font-size="11.5" font-weight="800" fill="#0e7490" text-anchor="start">WORLD · ACT</text><text x="357.4342062369262" y="304.248365386618" font-size="15" font-weight="700" fill="#0b1b33" text-anchor="start">Kapal berlayar, silo terisi</text><text x="357.4342062369262" y="326.248365386618" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">Shipping /assignments</text><text x="357.4342062369262" y="343.248365386618" font-size="12.5" font-weight="400" fill="#5b6b82" text-anchor="start">Manufacturer /incoming</text><rect x="590" y="425" width="420" height="190" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="800" y="468.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">PERCEIVE  ›  REASON  ›  ACT</text><text x="800" y="502" font-size="14" font-weight="400" fill="#e4ebf5" text-anchor="middle">Closed loop: tindakan yang disetujui mengubah</text><text x="800" y="523" font-size="14" font-weight="400" fill="#e4ebf5" text-anchor="middle">lingkungan, lalu sensor membaca perubahan itu.</text><text x="800" y="544" font-size="14" font-weight="400" fill="#e4ebf5" text-anchor="middle">Jam simulasi berhenti saat agent bekerja dan</text><text x="800" y="565" font-size="14" font-weight="400" fill="#e4ebf5" text-anchor="middle">saat keputusan menunggu manusia.</text><rect x="40" y="960" width="640" height="96" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="60" y="988.0" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="start">ADAPTIVE REPLANNING</text><text x="60" y="1012" font-size="13.5" font-weight="400" fill="#0b1b33" text-anchor="start">Badai di rute PP F (gelombang 3,4 m) atau kapal terlambat menjadi event baru:</text><text x="60" y="1031" font-size="13.5" font-weight="400" fill="#0b1b33" text-anchor="start">kapal bermuatan melambat sekitar 14 jam, siklus berjalan ulang, rencana lama diganti.</text><rect x="920" y="960" width="640" height="96" rx="6" fill="#fff" stroke="#c9d3e1" stroke-width="1.5"/><text x="940" y="988.0" font-size="12" font-weight="800" fill="#5b6b82" text-anchor="start">KONSEP KULIAH PADA SIKLUS INI</text><text x="940" y="1012" font-size="13.5" font-weight="400" fill="#0b1b33" text-anchor="start">orchestrator-worker dan eksekusi paralel (Materi 4.2), utility function (4.7),</text><text x="940" y="1031" font-size="13.5" font-weight="400" fill="#0b1b33" text-anchor="start">LLM sebagai explainer (5.5), human-in-the-loop (2.6), feedback loop (3.8)</text></svg>