# Enterprise databases (heterogeneous by design):
#   manufacturer -> PostgreSQL (database "manufacturer")
#   supplier     -> PostgreSQL (database "supplier"), separate database, separate schema style
#   shipping     -> MongoDB    (database "shipping")
#   distribution -> SQLite file (data/stores/distribution.db), no container needed
services:
  postgres:
    image: postgres:16-alpine
    container_name: mas-postgres
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas_local_dev
      POSTGRES_DB: manufacturer
    ports: ["5442:5432"]
    volumes:
      - mas_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d manufacturer"]
      interval: 3s
      retries: 20
  mongo:
    image: mongo:7
    container_name: mas-mongo
    ports: ["27027:27017"]
    volumes: [mas_mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 20
volumes:
  mas_pg:
  mas_mongo:
