<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="Archivo, 'Segoe UI', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b33"/></marker></defs><rect width="1600" height="920" fill="#f6f8fb"/><text x="60" y="64.0" font-size="34" font-weight="800" fill="#0b1b33" text-anchor="start">Alur Kerja Secara Garis Besar</text><text x="60" y="98.0" font-size="17" font-weight="400" fill="#5b6b82" text-anchor="start">Empat tahap yang terus berulang. Setiap tahap dikerjakan oleh pihak yang berbeda, dan manusia selalu memegang keputusan.</text><rect x="60" y="140" width="335" height="520" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/><rect x="60" y="140" width="335" height="86" rx="14" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/><rect x="60" y="210" width="335" height="16" rx="0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/><text x="84" y="194.0" font-size="28" font-weight="800" fill="#fff" text-anchor="start">1  AMATI</text><text x="373" y="194.0" font-size="16" font-weight="600" fill="#e4ebf5" text-anchor="end">Perceive</text><line x1="227.5" y1="252.6" x2="227.5" y2="263.6" stroke="#1d4ed8" stroke-width="3.3000000000000003"/><circle cx="227.5" cy="250.4" r="4.4" fill="#1d4ed8"/><rect x="203.3" y="263.6" width="48.400000000000006" height="33.0" rx="8.8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/><circle cx="217.6" cy="279.0" r="5.5" fill="#fff"/><circle cx="237.4" cy="279.0" r="5.5" fill="#fff"/><circle cx="217.6" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><circle cx="237.4" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><rect x="209.9" y="299.9" width="35.2" height="26.400000000000002" rx="5.5" fill="#fff" stroke="#1d4ed8" stroke-width="2.75"/><rect x="218.7" y="306.5" width="17.6" height="8.8" rx="2" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1"/><text x="84" y="362.0" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">APA YANG TERJADI</text><text x="84" y="386" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Dunia berubah: silo terkuras, kapal</text><text x="84" y="408" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">bergerak, cuaca berganti. Sensor dan</text><text x="84" y="430" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">agent pemantau membaca perubahan itu</text><text x="84" y="452" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">dan mengirim event.</text><text x="84" y="492.0" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">SIAPA</text><circle cx="90" cy="512" r="4" fill="#1d4ed8"/><text x="102" y="517.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Sensor silo IIoT</text><circle cx="90" cy="536" r="4" fill="#1d4ed8"/><text x="102" y="541.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Stock Monitoring</text><circle cx="90" cy="560" r="4" fill="#1d4ed8"/><text x="102" y="565.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Fleet Tracking</text><circle cx="90" cy="584" r="4" fill="#1d4ed8"/><text x="102" y="589.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Distribution, Procurement</text><rect x="76" y="610" width="303" height="34" rx="17" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="227.5" y="632.0" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Di aplikasi: Gauge silo dan kapal di peta</text><line x1="403" y1="290" x2="447" y2="290" stroke="#0b1b33" stroke-width="4" marker-end="url(#ah)"/><rect x="455" y="140" width="335" height="520" rx="14" fill="#fff" stroke="#0b1b33" stroke-width="2.5"/><rect x="455" y="140" width="335" height="86" rx="14" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><rect x="455" y="210" width="335" height="16" rx="0" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="479" y="194.0" font-size="28" font-weight="800" fill="#fff" text-anchor="start">2  PIKIRKAN</text><text x="768" y="194.0" font-size="16" font-weight="600" fill="#e4ebf5" text-anchor="end">Reason</text><line x1="622.5" y1="252.6" x2="622.5" y2="263.6" stroke="#0b1b33" stroke-width="3.3000000000000003"/><circle cx="622.5" cy="250.4" r="4.4" fill="#0b1b33"/><rect x="598.3" y="263.6" width="48.400000000000006" height="33.0" rx="8.8" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><circle cx="612.6" cy="279.0" r="5.5" fill="#fff"/><circle cx="632.4" cy="279.0" r="5.5" fill="#fff"/><circle cx="612.6" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><circle cx="632.4" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><rect x="604.9" y="299.9" width="35.2" height="26.400000000000002" rx="5.5" fill="#fff" stroke="#0b1b33" stroke-width="2.75"/><rect x="613.7" y="306.5" width="17.6" height="8.8" rx="2" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="479" y="362.0" font-size="12" font-weight="800" fill="#0b1b33" text-anchor="start">APA YANG TERJADI</text><text x="479" y="386" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Orchestrator membagi tugas. Agent</text><text x="479" y="408" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">menghitung forecast, prioritas</text><text x="479" y="430" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">plant, dan ranking kapal, lalu</text><text x="479" y="452" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Narrator menjelaskan hasilnya.</text><text x="479" y="492.0" font-size="12" font-weight="800" fill="#0b1b33" text-anchor="start">SIAPA</text><circle cx="485" cy="512" r="4" fill="#0b1b33"/><text x="497" y="517.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Orchestrator</text><circle cx="485" cy="536" r="4" fill="#0b1b33"/><text x="497" y="541.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">ML Forecasting, Demand &amp; Priority</text><circle cx="485" cy="560" r="4" fill="#0b1b33"/><text x="497" y="565.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Dispatch Planner (SAW)</text><circle cx="485" cy="584" r="4" fill="#0b1b33"/><text x="497" y="589.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Narrator</text><rect x="471" y="610" width="303" height="34" rx="17" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="622.5" y="632.0" font-size="13" font-weight="700" fill="#0b1b33" text-anchor="middle">Di aplikasi: Box 1 sampai 7 di docket</text><line x1="798" y1="290" x2="842" y2="290" stroke="#0b1b33" stroke-width="4" marker-end="url(#ah)"/><rect x="850" y="140" width="335" height="520" rx="14" fill="#fff" stroke="#b45309" stroke-width="2.5"/><rect x="850" y="140" width="335" height="86" rx="14" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="850" y="210" width="335" height="16" rx="0" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="874" y="194.0" font-size="28" font-weight="800" fill="#fff" text-anchor="start">3  PUTUSKAN</text><text x="1163" y="194.0" font-size="16" font-weight="600" fill="#e4ebf5" text-anchor="end">Decide</text><circle cx="1017.5" cy="274.6" r="14.3" fill="#b45309"/><path d="M991.1,323.0 Q1017.5,285.6 1043.9,323.0 Z" fill="#b45309"/><rect x="1032.9" y="294.4" width="19.8" height="15.400000000000002" rx="2" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="1042.8" y="306.5" font-size="8.8" font-weight="800" fill="#b45309" text-anchor="middle">OK</text><text x="874" y="362.0" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">APA YANG TERJADI</text><text x="874" y="386" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Manusia membaca rencana beserta</text><text x="874" y="408" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">penjelasannya, lalu menekan Approve</text><text x="874" y="430" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">atau Reject. Tanpa persetujuan,</text><text x="874" y="452" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">tidak ada kapal yang berangkat.</text><text x="874" y="492.0" font-size="12" font-weight="800" fill="#b45309" text-anchor="start">SIAPA</text><circle cx="880" cy="512" r="4" fill="#b45309"/><text x="892" y="517.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Global Administrator</text><circle cx="880" cy="536" r="4" fill="#b45309"/><text x="892" y="541.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Manufacturer Manager</text><circle cx="880" cy="560" r="4" fill="#b45309"/><text x="892" y="565.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Shipping Manager</text><rect x="866" y="610" width="303" height="34" rx="17" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="1017.5" y="632.0" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Di aplikasi: Box 8 Authorisation</text><line x1="1193" y1="290" x2="1237" y2="290" stroke="#0b1b33" stroke-width="4" marker-end="url(#ah)"/><rect x="1245" y="140" width="335" height="520" rx="14" fill="#fff" stroke="#0e7490" stroke-width="2.5"/><rect x="1245" y="140" width="335" height="86" rx="14" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><rect x="1245" y="210" width="335" height="16" rx="0" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="1269" y="194.0" font-size="28" font-weight="800" fill="#fff" text-anchor="start">4  BERTINDAK</text><text x="1558" y="194.0" font-size="16" font-weight="600" fill="#e4ebf5" text-anchor="end">Act</text><line x1="1412.5" y1="252.6" x2="1412.5" y2="263.6" stroke="#0e7490" stroke-width="3.3000000000000003"/><circle cx="1412.5" cy="250.4" r="4.4" fill="#0e7490"/><rect x="1388.3" y="263.6" width="48.400000000000006" height="33.0" rx="8.8" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><circle cx="1402.6" cy="279.0" r="5.5" fill="#fff"/><circle cx="1422.4" cy="279.0" r="5.5" fill="#fff"/><circle cx="1402.6" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><circle cx="1422.4" cy="279.0" r="2.4200000000000004" fill="#22d3ee"/><rect x="1394.9" y="299.9" width="35.2" height="26.400000000000002" rx="5.5" fill="#fff" stroke="#0e7490" stroke-width="2.75"/><rect x="1403.7" y="306.5" width="17.6" height="8.8" rx="2" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="1269" y="362.0" font-size="12" font-weight="800" fill="#0e7490" text-anchor="start">APA YANG TERJADI</text><text x="1269" y="386" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Rencana dikirim ke API Shipping dan</text><text x="1269" y="408" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">Manufacturer. Kapal memuat,</text><text x="1269" y="430" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">berlayar, dan membongkar muatan,</text><text x="1269" y="452" font-size="15.5" font-weight="400" fill="#0b1b33" text-anchor="start">sehingga silo terisi kembali.</text><text x="1269" y="492.0" font-size="12" font-weight="800" fill="#0e7490" text-anchor="start">SIAPA</text><circle cx="1275" cy="512" r="4" fill="#0e7490"/><text x="1287" y="517.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Shipping API (assignment)</text><circle cx="1275" cy="536" r="4" fill="#0e7490"/><text x="1287" y="541.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Manufacturer API (jadwal tiba)</text><circle cx="1275" cy="560" r="4" fill="#0e7490"/><text x="1287" y="565.0" font-size="14.5" font-weight="600" fill="#0b1b33" text-anchor="start">Kapal di dunia nyata</text><rect x="1261" y="610" width="303" height="34" rx="17" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="1412.5" y="632.0" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">Di aplikasi: Kapal berlayar, gauge silo naik</text><path d="M1412.5,664 L1412.5,730 L227.5,730 L227.5,668" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah)"/><rect x="560" y="712" width="480" height="36" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="0"/><text x="800" y="736.0" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">Dunia sudah berubah, sensor membaca lagi, siklus berulang</text><rect x="60" y="770" width="700" height="120" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/><text x="84" y="804.0" font-size="18" font-weight="800" fill="#b91c1c" text-anchor="start">Ada badai atau kapal terlambat?</text><text x="84" y="832" font-size="15" font-weight="400" fill="#0b1b33" text-anchor="start">Kejadian itu masuk sebagai event baru di tahap AMATI. Sistem kembali ke tahap</text><text x="84" y="853" font-size="15" font-weight="400" fill="#0b1b33" text-anchor="start">PIKIRKAN dan menyusun rencana baru, lalu manusia menyetujuinya lagi.</text><rect x="790" y="770" width="750" height="120" rx="12" fill="#0b1b33" stroke="#0b1b33" stroke-width="1"/><text x="814" y="804.0" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Pembagian peran</text><text x="814" y="836.0" font-size="16" font-weight="800" fill="#7dd3fc" text-anchor="start">Kode memutuskan</text><text x="990" y="836.0" font-size="14.5" font-weight="400" fill="#e4ebf5" text-anchor="start">angka dihitung model ML dan SAW di tahap PIKIRKAN</text><text x="814" y="866.0" font-size="16" font-weight="800" fill="#7dd3fc" text-anchor="start">Manusia bertindak</text><text x="990" y="866.0" font-size="14.5" font-weight="400" fill="#e4ebf5" text-anchor="start">tidak ada tindakan tanpa persetujuan di tahap PUTUSKAN</text></svg>